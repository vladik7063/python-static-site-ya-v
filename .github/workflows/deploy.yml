name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - run: pip install mkdocs
      - run: mkdocs build
      - uses: actions/upload-pages-artifact@v2
        with:
          path: ./site
      - uses: actions/deploy-pages@v2
